<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activités du lycée de Mergington</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Lycée de Mergington</h1>
      <h2>Activités extrascolaires</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Activités disponibles</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Chargement des activités...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>S’inscrire à une activité</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">E-mail de l’élève :</label>
            <input type="email" id="email" required placeholder="votre-e-mail@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Choisissez une activité :</label>
            <select id="activity" required>
              <option value="">-- Choisissez une activité --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">S’inscrire</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Lycée de Mergington</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
